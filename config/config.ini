[app]
name = Agentic Document Processor
version = 1.0.0
environment = development
debug = false

[api]
host = 0.0.0.0
port = 8000
reload = true
workers = 1

[streamlit]
host = 0.0.0.0
port = 8501

[llm]
default_provider = ollama
groq_api_key =
aws_access_key_id =
aws_secret_access_key =
aws_region = us-east-1

[processing]
data_dir = data
labreports_dir = data/labreports
prescriptions_dir = data/prescriptions
reports_dir = data/reports
reviews_db_path = data/reviews.db
supported_formats = pdf,txt
max_file_size_mb = 10
min_text_length = 10
strict_validation = true

# HITL and supervisor controls
confidence_threshold = 0.70
review_flag_severities = HIGH,CRITICAL
review_timeout_hours = 4
interrupt_before_repair = false
timeout_action = escalate
review_poll_interval_seconds = 300
max_repair_attempts = 3

# Feature flags
enable_knowledge_lookup = false
knowledge_dir = data/knowledge

[logging]
level = INFO
log_to_file = false
file_path = logs/app.log
max_file_size_mb = 10
backup_count = 5

[langsmith]
enabled = false
api_key =
project = agentic-doc-processor
endpoint = https://api.smith.langchain.com

[metrics]
enable_metrics = true
metrics_file = data/reports/metrics_report.csv
enable_performance_tracking = true
p95_latency_threshold_ms = 3500
